services:
  app:
    build:
      context: ./php
    container_name: laravel-app
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME:-laravel}
      - DB_USERNAME=${DB_USER:-laravel}
      - DB_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
      - REDIS_HOST=redis
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laravel

  web:
    image: nginx:1.27-alpine
    container_name: laravel-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  queue:
    build:
      context: ./php
    container_name: laravel-queue
    restart: unless-stopped
    command: php /var/www/html/artisan queue:work --tries=3 --sleep=3
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_NAME:-laravel}
      - DB_USERNAME=${DB_USER:-laravel}
      - DB_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
      - REDIS_HOST=redis
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  scheduler:
    build:
      context: ./php
    container_name: laravel-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_NAME:-laravel}
      - DB_USERNAME=${DB_USER:-laravel}
      - DB_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
      - REDIS_HOST=redis
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mariadb:11.4
    container_name: laravel-db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${DB_NAME:-laravel}
      - MARIADB_USER=${DB_USER:-laravel}
      - MARIADB_PASSWORD=${DB_PASS:?Set DB_PASS in .env}
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASS:-secret}"]
    volumes:
      - redis-data:/data
    networks:
      - laravel

  backup:
    image: mariadb:11.4
    container_name: laravel-backup
    restart: "no"
    profiles: ["tools"]
    environment:
      - MARIADB_PWD=${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    entrypoint: ["/backup-db.sh"]
    depends_on:
      - db
    networks:
      - laravel

volumes:
  db-data:
  redis-data:

networks:
  laravel:
    driver: bridge
